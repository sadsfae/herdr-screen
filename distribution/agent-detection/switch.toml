id = "switch"
version = "2026.10.13.1"
min_engine_version = 4
updated_at = "2026-10-13T00:00:00Z"

# Identity signatures. A pane whose foreground ssh/telnet client shows one of
# these lines is a switch session, evaluated before any state rule runs; this is
# the identification half that used to live in the binary, so a deployment can
# extend it with a local override at ~/.config/herdr/agent-detection/switch.toml.
# - `vendor` labels the pane (`sw-arista`); unset for shared device prompt forms
#   that only prove "some network OS CLI".
# - `tail_only` matches prompt and login-banner forms inside the screen tail
#   only, so a stale prompt further up in scrollback cannot identify a session;
#   vendor output is matched across the whole visible screen because
#   `show version`-class output scrolls past the tail in one frame.
# - Every prompt pattern excludes the `:` path and `~` of a normal Linux/BSD
#   shell prompt; bare `host>` / `host#` EXEC prompts stay state rules only.
# Engine 4 is required: older clients reject this manifest and keep their
# bundled one, whose binary still carries the same signatures as a fallback.

[[identity]]
line_regex = "^\\s*Arista\\s+(?:(?:DCS|CCS|vEOS)\\S*|Networks\\s+\\S+)\\s*$"
vendor = "arista"

[[identity]]
line_regex = "^\\s*Software image version:\\s*\\S+\\s*$"

[[identity]]
line_regex = "^\\s*Arista Networks EOS shell\\s*$"
vendor = "arista"

[[identity]]
line_regex = "^\\s*%?\\s*Invalid input \\(at token \\d+: '[^']*'\\)\\s*$"
vendor = "arista"

[[identity]]
line_regex = "^\\s*%?\\s*Invalid input \\(privileged mode required\\)\\s*$"
vendor = "arista"

[[identity]]
line_regex = "^\\s*Cisco IOS(?: XE)? Software"
vendor = "cisco"

[[identity]]
line_regex = "^---\\s*JUNOS\\s+\\S+"
vendor = "juniper"
tail_only = true

[[identity]]
line_regex = "^\\[edit[^\\]]*\\]\\s*$"
vendor = "juniper"
tail_only = true

[[identity]]
line_regex = "^\\S+@[^:\\s>]+>\\s*$"
vendor = "juniper"
tail_only = true

[[identity]]
line_regex = "^\\S+@[^:\\s#]+#\\s*$"
vendor = "juniper"
tail_only = true

[[identity]]
line_regex = "^[A-Za-z0-9][A-Za-z0-9._-]*\\(config(?:-[^)]+)?\\)#\\s*$"
tail_only = true

# Network switch (or router) sessions reached over an interactive SSH / telnet
# login. No hostname, vendor brand, or environment string is matched, so these
# rules apply to any deployment. Prompts are vendor-scoped:
# - Juniper JunOS / JunOS EVO: user@host> (operational), user@host# (config),
#   with an `[edit ...]` breadcrumb line above the config prompt.
# - Arista EOS / Cisco IOS(-XE): host> (user EXEC), host# (privileged EXEC),
#   host(config...)# (config and sub-modes). EOS over SSH prints no vendor text
#   at login (`no banner login` is the default), so an EOS session is
#   identified from vendor output (`Arista DCS-...`, `Software image version:`,
#   the `Arista Networks EOS shell` bash banner, or the `Invalid input (at
#   token N: 'x')` CLI error) rather than from the prompt; the EOS bash prompt
#   is a plain Linux `[admin@Switch ~]$`.
# A normal Linux/BSD shell prompt with a path component (user@host:~$,
# root@host:/var/log#) never matches because it carries a `:` path and `~`,
# which these patterns exclude; a PS1 without a path (user@host>) is
# indistinguishable from a JunOS prompt and does match.
# The bare host> / host# EXEC forms are state rules only, applied after the
# pane is identified as a switch: on their own they also match a hostname-only
# Linux PS1, so they are not an identity signal (an Arista/Cisco EXEC-only
# session that never enters config mode is picked up via `agent start --kind
# switch`, which seeds the pane's identity from the launched ssh process).
# Every rule is anchored to the last non-empty line so stale prompts further up
# in scrollback cannot keep a pane classified after the user logs out.

[[rules]]
id = "interactive_prompt"
state = "blocked"
priority = 950
region = "bottom_non_empty_lines(1)"
visible_blocker = true
# Credential prompt and interactive confirmations. Juniper confirmations end
# with a bracketed default, e.g. "Exit with uncommitted changes? [yes,no] (yes)";
# Cisco asks "Proceed with reload? [confirm]" / "[yes/no]".
any = [
  { line_regex = ['^\s*(?:Password|passphrase):?\s*$'] },
  { line_regex = ['\?\s*\[[^\]]*(?:yes|no|y|n|confirm)[^\]]*\]'] },
  { line_regex = ['\?\s*.*\(?(?:yes|no|y|n)\)?\s*$'] },
]

[[rules]]
id = "paged_output"
state = "working"
priority = 900
region = "bottom_non_empty_lines(1)"
visible_working = true
# The device is paginating a long output listing (press Space/Enter to
# continue): Cisco/Arista `--More--` / `---- More ----`, JunOS
# `---(more)---` / `---(more NN%)---`.
line_regex = ['^\s*\*?\s*(?:-+\s*More\s*-+|---\(more(?:\s+\d+%)?\)---)\s*$']
[[rules]]
id = "at_prompt"
state = "idle"
priority = 500
region = "bottom_non_empty_lines(1)"
visible_idle = true
any = [
  # Juniper operational prompt: user@host> (no `:` path, no `~`).
  { line_regex = ['^\S+@[^:\s>]+>\s*$'] },
  # Juniper config prompt: user@host#.
  { line_regex = ['^\S+@[^:\s#]+#\s*$'] },
  # Arista / Cisco user EXEC prompt: bare host>.
  { line_regex = ['^[A-Za-z0-9][A-Za-z0-9._-]*>\s*$'] },
  # Arista / Cisco privileged EXEC prompt: bare host# (allow a session suffix).
  { line_regex = ['^[A-Za-z0-9][A-Za-z0-9._-]*(?:\(s[12]\))?#\s*$'] },
  # Arista / Cisco / EOS config and sub-config prompt: host(config...)#.
  { line_regex = ['^[A-Za-z0-9][A-Za-z0-9._-]*\(config(?:-[^)]+)?\)#\s*$'] },
  # Arista EOS bash prompt: [admin@Switch ~]$ (the documented EOS shell prompt;
  # a state rule only, because the prompt itself is Linux-shaped. The bash entry
  # banner "Arista Networks EOS shell" is the identity signal.)
  { line_regex = ['^\[\S+@\S+ [^\]]*\]\$\s*$'] },
]
