name: Bug report
description: Report a reproducible bug.
body:
  - type: markdown
    attributes:
      value: |
        Keep this short. If it does not fit on one screen, it is too long. Write in your own voice.

  - type: checkboxes
    id: bug-confirmation
    attributes:
      label: Is this a reproducible bug?
      options:
        - label: I confirm this is a reproducible bug, not a feature request, idea, or question.
          required: true
        - label: I reproduced this bug on the version and environment reported below using the exact steps provided.
          required: true

  - type: textarea
    id: current-behavior
    attributes:
      label: Current behavior
      description: What is happening now? Describe what you observed, not a guessed cause.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: What are the shortest exact steps or commands that show the problem?
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How does this affect you?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version, update channel, operating system, and terminal are required. Shell and relevant config are optional.
      value: |
        - Version:
        - Update channel (stable or preview):
        - Operating system:
        - Terminal:
        - Shell, if relevant:
        - Relevant config, if any:
    validations:
      required: true
