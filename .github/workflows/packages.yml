name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: packages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm musl-tools xz-utils

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Stabilize Zig installation path
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            mv "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Save Zig compiler
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HERDR_BUILD_CHANNEL: herdrscreen
        run: bash packaging/release.sh

      - name: Save Cargo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          update_release: true
          files: dist/*

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "nightly" --notes "Built from $GITHUB_SHA"
          for asset in $(gh release view nightly --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); do
            gh release delete-asset nightly "$asset" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release upload nightly dist/* --repo "$GITHUB_REPOSITORY" --clobber
