name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: packages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm musl-tools xz-utils

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Stabilize Zig installation path
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            mv "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Save Zig compiler
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Main-push builds carry the fork release version (bumped past the
            # latest tagged release) from RELEASE_VERSION, so install docs and
            # the `latest` release stay aligned while the runtime version in
            # Cargo.toml remains independent for plugin compatibility.
            echo "value=$(head -1 RELEASE_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          fi

      - name: Build artifacts
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HERDR_BUILD_CHANNEL: herdr-screen
        run: bash packaging/release.sh

      - name: Save Cargo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          update_release: true
          files: dist/*

      # One release concept: a fresh release per main push. Tag each with the
      # fork release version (RELEASE_VERSION) plus the commit SHA so every push
      # is distinct; the GitHub `latest` release then always points at the
      # newest main build. (A tagged v* push still becomes a formal snapshot
      # release above.)
      - name: Publish main-branch release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="v${version}-${GITHUB_SHA::7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes "Built from ${GITHUB_SHA::7}" dist/*

  # Keep the README install commands pointing at the released version. Runs on
  # every main push and every tag push so install docs always target the newest
  # release. Reads the version from RELEASE_VERSION (the fork release cadence).
  sync-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: true
      - name: Pin README and push
        run: |
          python3 scripts/sync-readme-version.py
          if git diff --quiet README.md; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: pin install commands to latest release"
          git push origin main
