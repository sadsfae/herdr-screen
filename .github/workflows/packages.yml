name: packages

on:
  push:
    branches: [main]
    tags: ['v*']
    # The sync-readme job pushes README/RELEASE_VERSION pins; those are not
    # release-relevant and must not rebuild packages.
    paths-ignore:
      - README.md
      - RELEASE_VERSION
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_TOOLCHAIN_VERSION: 1.96.1
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
  ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache

concurrency:
  group: packages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-unknown-linux-musl

      - name: Install package build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm musl-tools xz-utils

      # Zig downloads come from ziglang.org or a random community mirror and
      # vary from seconds to minutes; reuse the verified install instead.
      - name: Restore Zig compiler
        id: zig-compiler
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Install Zig
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Stabilize Zig installation path
        env:
          ZIG_RESTORED: ${{ steps.zig-compiler.outputs.cache-hit }}
        run: |
          stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
          if [ "$ZIG_RESTORED" != "true" ]; then
            mv "$(dirname "$(command -v zig)")" "$stable_zig"
          fi
          echo "$stable_zig" >> "$GITHUB_PATH"
          echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

      - name: Save Zig compiler
        if: steps.zig-compiler.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/herdr-zig-0.16.0
          key: zig-compiler-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0

      - name: Restore Cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Normalize through the tag parser so per-push tags like
            # v0.2.4-7802b16 publish as their clean semver (0.2.4).
            value="$(python3 scripts/next_version.py --tag-version "$GITHUB_REF_NAME" 2>/dev/null || echo "${GITHUB_REF_NAME#v}")"
            echo "value=$value" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            # Base the next version on the previous release tag (v0.2.3-<sha>
            # or plain v0.2.2) so repeated main pushes advance the version
            # instead of republishing the same 0.2.3-1 NVR. Only version tags
            # count (nightly and other non-version tags are ignored), and when
            # no version tag exists yet the whole history is scanned against
            # RELEASE_VERSION so the first release still bumps.
            last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
            base="$(head -1 RELEASE_VERSION | tr -d '[:space:]')"
            if [[ -n "$last_tag" ]]; then
              base="$(python3 scripts/next_version.py --tag-version "$last_tag")"
              range="$last_tag..HEAD"
            else
              range="HEAD"
            fi
            next="$(python3 scripts/next_version.py --base "$base" --range "$range")"
            echo "value=$next" >> "$GITHUB_OUTPUT"
            if [[ "$next" == "$base" ]]; then
              echo "bumped=false" >> "$GITHUB_OUTPUT"
            else
              echo "bumped=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build artifacts
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
          HERDR_BUILD_CHANNEL: herdr-screen
        run: bash packaging/release.sh

      - name: Save Cargo cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
          key: packages-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          update_release: true
          files: dist/*

      # One release concept: a release per version bump on main. Tag each with
      # the fork release version plus the commit SHA so every published version
      # is distinct from the last (0.2.3 -> 0.2.4 -> 0.3.0); the GitHub
      # `latest` release then always points at the newest main build. Pushes
      # without a version bump (docs:, ci:, chore:, ...) publish nothing, so
      # RPM name-version-release stays unique and `dnf update` can upgrade.
      - name: Publish main-branch release
        if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
            && steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="v${version}-${GITHUB_SHA::7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes "Built from ${GITHUB_SHA::7}" dist/*

  # Keep the README install commands and RELEASE_VERSION pointing at the
  # version actually published by the build job. Runs after every build so
  # install docs always target the newest release; updates are ignored by the
  # push trigger (paths-ignore) so they never re-enter the pipeline.
  sync-readme:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: true
      - name: Pin README and push
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            # Main pushes pin to the version just published. Tag pushes keep
            # the old behavior (pin to RELEASE_VERSION) so re-pushing an old
            # formal tag can never move the docs backward.
            python3 scripts/sync-readme-version.py --version "$VERSION"
          else
            python3 scripts/sync-readme-version.py
          fi
          if git diff --quiet README.md RELEASE_VERSION; then
            echo "README already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md RELEASE_VERSION
          git commit -m "docs: pin install commands to latest release"
          git push origin main
